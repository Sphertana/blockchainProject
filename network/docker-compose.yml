name: classledger

x-besu: &besu
  image: ${BESU_IMAGE:-hyperledger/besu:24.12.0}
  restart: unless-stopped
  entrypoint: ["besu"]
  command:
    - --genesis-file=/config/genesis.json
    - --static-nodes-file=/config/static-nodes.json
    - --node-private-key-file=/config/key
    - --data-path=/data
    - --discovery-enabled=false
    - --min-gas-price=0
    - --rpc-http-enabled=true
    - --rpc-http-host=0.0.0.0
    - --rpc-http-port=8545
    - --rpc-http-api=ETH,NET,WEB3,QBFT
    - --rpc-http-cors-origins=all
    - --host-allowlist=*
    - --p2p-port=30303

services:
  validator1:
    <<: *besu
    container_name: validator1
    environment: [BESU_P2P_HOST=172.28.0.11]
    volumes:
      - ./data/genesis.json:/config/genesis.json:ro
      - ./data/static-nodes.json:/config/static-nodes.json:ro
      - ./data/validator1/key:/config/key:ro
      - v1data:/data
    networks:
      besu:
        ipv4_address: 172.28.0.11

  validator2:
    <<: *besu
    container_name: validator2
    environment: [BESU_P2P_HOST=172.28.0.12]
    volumes:
      - ./data/genesis.json:/config/genesis.json:ro
      - ./data/static-nodes.json:/config/static-nodes.json:ro
      - ./data/validator2/key:/config/key:ro
      - v2data:/data
    networks:
      besu:
        ipv4_address: 172.28.0.12

  validator3:
    <<: *besu
    container_name: validator3
    environment: [BESU_P2P_HOST=172.28.0.13]
    volumes:
      - ./data/genesis.json:/config/genesis.json:ro
      - ./data/static-nodes.json:/config/static-nodes.json:ro
      - ./data/validator3/key:/config/key:ro
      - v3data:/data
    networks:
      besu:
        ipv4_address: 172.28.0.13

  validator4:
    <<: *besu
    container_name: validator4
    environment: [BESU_P2P_HOST=172.28.0.14]
    volumes:
      - ./data/genesis.json:/config/genesis.json:ro
      - ./data/static-nodes.json:/config/static-nodes.json:ro
      - ./data/validator4/key:/config/key:ro
      - v4data:/data
    networks:
      besu:
        ipv4_address: 172.28.0.14

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: classledger-api
    depends_on: [validator1, validator2, validator3, validator4]
    env_file: ../.env
    environment:
      - RPC_URL=http://validator1:8545
    volumes:
      - ../data:/app/data
    ports:
      - "${WEB_PORT:-8000}:8000"
    networks:
      - besu

networks:
  besu:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  v1data:
  v2data:
  v3data:
  v4data:
